[project]
name = "autohotcue"
version = "0.1.0"
description = "Automatic hot cues for djay Pro — analyzes audio (incl. .opus/.ogg) and writes cues into djay's MediaLibrary.db"
readme = "README.md"
license = "MIT"
authors = [
    { name = "payne0420", email = "payne0420@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beat-this>=1.1.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
allin1 = [
    "all-in-one-mlx>=1.0.5",
    "demucs-mlx[convert]>=1.4.3",
    "mlx-audio-io>=1.3.10",
]
songformer = [
    "transformers>=4.51,<5",
    "muq>=0.1.0",
    "torchaudio",
    "omegaconf",
    "loguru",
    "ema-pytorch",
    "x-transformers",
]

[project.scripts]
autohotcue = "autohotcue.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
