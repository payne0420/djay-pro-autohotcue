[project]
name = "autohotcue"
version = "0.1.0"
description = "Automatic hot cues for djay Pro — analyzes audio (incl. .opus/.ogg) and writes cues into djay's MediaLibrary.db"
readme = "README.md"
license = "MIT"
authors = [
    { name = "payne0420", email = "payne0420@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "soundfile>=0.14.0",
]

[project.scripts]
autohotcue = "autohotcue.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
